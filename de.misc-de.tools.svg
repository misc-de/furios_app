<!-- Two switches in different positions.

     The icon used to be a loudspeaker with sound waves, from when this app
     was the audio switcher and nothing else. It now drives four tools, so a
     speaker named one quarter of it.

     What all four pages have in common is the switch: shipped state on one
     side, repair on the other. Two of them rather than one, because one alone
     reads as "settings" and says nothing about this app; three stop being
     legible at 32 px, which is the size that matters on the app grid.

     The off one is drawn as an outline rather than a faded fill - at 55 %
     opacity it read as disabled, which is a different thing from off. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>

  <!-- on -->
  <rect x="28" y="33" width="72" height="26" rx="13" fill="#ffffff"/>
  <circle cx="87" cy="46" r="9" fill="#1a5fb4"/>

  <!-- off -->
  <rect x="28" y="69" width="72" height="26" rx="13" fill="none"
        stroke="#ffffff" stroke-width="6"/>
  <circle cx="41" cy="82" r="9" fill="#ffffff"/>
</svg>
