#
# The suite, on every push.
#
# Why this exists: the tests only ever ran when somebody on the phone
# remembered to type run-tests.sh, which is a poor place to keep a safety
# net. They need no display, no battery, no radio and no root - everything
# they touch is a stub or a copy - so an ordinary x86 runner can say whether
# the last commit still holds.
#
# What a runner cannot say is whether the PHONE still works. That is measured
# on the device, and the README says so in the same words.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tools the suite looks for
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils python3-gi gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Run it
        run: |
          set -o pipefail
          ./tests/run-tests.sh 2>&1 | tee /tmp/suite.log

      - name: Only the phone may be missing here
        run: |
          # A skip is not a failure by itself. A good part of these suites
          # cross-checks our own programs against each other, and on a runner
          # audioctl, gpsctl, modemctl and WirePlumber are simply not there -
          # that skip is honest, and saying so is the point of it.
          #
          # A skip for want of a TOOL is a different thing: the step above
          # installs those, so one of them being reported missing means that
          # step is wrong and a whole check silently did not run. Which is
          # exactly what this phone had been doing with shellcheck since the
          # suite was written.
          if grep -Eni 'no shellcheck|no desktop-file-validate|systemd-analyze not available|luac?5\.4 not installed|no GTK3' /tmp/suite.log; then
              echo "::error::a check was skipped for want of a tool - install it in the step above"
              exit 1
          fi
